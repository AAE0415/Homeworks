# Netlify: compila con Vite y publica la carpeta dist.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: todas las rutas (/menu, /cuenta/..., /admin/...) las resuelve React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Las fotos y fuentes casi no cambian: caché larga
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
